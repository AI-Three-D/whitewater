<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<title>Whitewater — WebGPU shallow-water kayaking</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <canvas id="c"></canvas>
  <div id="ver"></div>
  <div id="hud"></div>
  <div id="clock"></div>
  <div id="stam"><div id="stamfill"></div><span id="stamtxt"></span></div>
  <div id="loot"><div class="lc" id="pcount">🛶 <b>0</b>/0</div><div class="lc" id="ccount">🪙 <b>0</b>/0</div><div class="lc" id="scount">🥜 <b>0</b></div><div class="lc" id="dcount">⚡ <b>0</b></div></div>

  <div id="gl"></div>
  <div id="gauge"><div class="l"></div><div class="r"></div><div class="z"></div><div id="mk"></div></div>
  <div id="dbg"></div>
  <!-- mobile: round paddle pads + in-run buttons; css shows them only for body.mobile.inrun.
       they sit before #msg in the DOM so the end-of-run overlay covers them -->
       
  <div class="pad" id="padL" aria-label="paddle on the left">
    <svg viewBox="0 0 64 64"><path d="M46 14 L22 42" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
      <ellipse cx="17" cy="48" rx="6.5" ry="11" transform="rotate(40 17 48)" fill="#ffe08a"/></svg></div>
  <div class="pad" id="padR" aria-label="paddle on the right">
    <svg viewBox="0 0 64 64"><path d="M46 14 L22 42" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
      <ellipse cx="17" cy="48" rx="6.5" ry="11" transform="rotate(40 17 48)" fill="#ffe08a"/></svg></div>
  <div class="mbtn" id="mExit" title="river menu">✕</div>
  <div class="mbtn" id="mCam" title="camera">📷</div>
  <div class="mbtn" id="mDbg" title="debug">🐞</div>
  <div class="mbtn" id="mEat" title="eat a snack">🥜</div>
  <div class="mbtn" id="mDrink" title="drink an energy booster">⚡</div>
  <div class="mbtn" id="mGod" title="debug: no capsize">🛡️</div>
  <div class="mbtn" id="mPause" title="pause">⏸️</div>

  <div id="msg"></div>
  <div id="menu">
    <div class="art-slot" id="menuHero" style="background-image:url('img/Hero.png');background-size:cover;background-position:center" role="img" aria-label="hero art"></div>
    <button id="howtoBtn" class="howto-btn">📖 How to play</button>
    <h1>WHITEWATER</h1>
    <div id="quality"></div>
    <div id="charsel"></div>
<div id="topbar"></div>
<div id="craftbar"></div>
<div id="riverlist"></div>
  </div>
  <div id="lvl"></div>
  <div id="charsheet"></div>
  <div id="store"></div>
  <div id="howto"></div>
  <div id="err"></div>
  <script type="module" src="js/main.js?v=34"></script>
</body>
</html>
